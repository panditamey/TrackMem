# Model is chosen with `train.py --model <name>` (overrides model.name).
experiment: null              # run directory name under train.out_dir; null = model name
seed: 42

data:
  root: data/TracknetV2
  cache: data/cache/frames_512x288      # written by tools/extract_frames.py
  width: 512
  height: 288
  train_splits: [Professional, Amateur]
  val_matches: [Professional/match21, Professional/match22, Professional/match23]
  test_splits: [Test]
  seq_len: 3                  # frames per window (t-1, t, t+1), as in V5
  train_stride: 1             # window center step when building training samples
  heatmap_radius: 4.2         # binary disk radius (px @ 512x288); V5 SDK target ~10.5 px @ 1280x720
  hflip: 0.5
  limit_rallies: null         # int: use only first N rallies per split (smoke tests)

model:
  name: tracknetv5            # tracknetv5 | trackmem
  tracknetv5:                 # defaults follow the official TrackNetV5 SDK
    rstr: true                # false = MDD + U-Net only (no R-STR head)
    conv_order: conv_relu_bn  # conv_relu_bn (SDK) | conv_bn_relu
    upsample: bilinear        # bilinear (SDK) | nearest
    mdd_init: [0.2, 0.15]
  trackmem:                   # TrackNetV5 + learned persistent kinematic memory
    rstr: true
    latent_dim: 64            # learned memory vector size
    prior_sigma_min: 1.5      # min prior Gaussian width (px @ 512x288)
    fusion: late              # late = prior joins after an image-only U-Net, memory measures the
                              #   prior-free evidence map | early = prior as input channels (first run)
    vis_memory: true          # visibility head also sees memory speed / confidence / out-of-frame

train:
  epochs: 30
  batch_size: 8               # V5 used 2
  lr: 1.0e-4
  weight_decay: 1.0e-2
  milestones: [20, 25]
  gamma: 0.1
  grad_clip: 1.0              # max grad norm (V5 SDK); null = off
  num_workers: 8
  amp: auto                   # auto | bf16 | fp16 | off
  compile: false
  out_dir: runs
  log_every: 50
  val_every: 1
  max_steps_per_epoch: null   # int: cap steps per epoch (smoke tests)
  trackmem:                   # recurrent training (memory in the loop)
    seq_steps: 8              # windows per training sequence
    warmup_epochs: 2          # single-step epochs first (detector learns before memory matters)
    warm_start_p: 0.5         # sequences starting from noisy GT memory; rest start cold
    false_prior_p: 0.4        # of warm starts: memory placed at a random wrong position (first run 0.1)
    jitter_px: 3.0            # warm-start position noise
    corrupt_p: 0.2            # per-step chance of shifting the memory mid-sequence (first run 0.05)
    corrupt_px: 60.0          # (first run 20)
    prior_dropout: 0.4        # per-step chance of hiding the prior from the detector
    invisible_heatmap_weight: 0.3   # heatmap loss weight on invisible frames (visibility head handles absence)
    vis_weight: 0.01
    vis_invisible_weight: 3.0 # visibility BCE weight on invisible frames (first run 1)
    evidence_weight: 1.0      # heatmap loss on the prior-free evidence map (late fusion)
    offset_weight: 0.01

eval:
  threshold: 0.5
  tolerance: 4                # px
  primary_space: orig         # orig (1280x720) | input (512x288): space used for best-ckpt F1
  ensemble: average           # center | average (average overlapping window predictions; tracknetv5)
  memory_mode: normal         # normal | reset (trackmem memory-use test: clear memory every frame)
  detect: product             # trackmem: product = P(visible) x heatmap peak > threshold | vis = P(visible) alone
  batch_size: 16

subsets:
  fast_speed: 9.5             # px/frame @512 width (~p90 of dataset speed)
  top_border: 0.08            # fraction of height: gap bracket above this = out-of-frame
  short_gap: 3                # invisible run length <= this = short occlusion
  reappear_frames: 3          # visible frames after a gap tagged as reappearance
  reappear_min_gap: 2
  hit_angle: 60               # deg velocity direction change tagged as hit
  hit_window: 2               # frames around a hit also tagged
